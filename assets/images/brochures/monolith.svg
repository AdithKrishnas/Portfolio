<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="mono-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a"/>
      <stop offset="100%" stop-color="#08090b"/>
    </linearGradient>
    <linearGradient id="book-shadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="15%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#mono-bg)"/>

  <!-- Brochure / Book Open Mockup -->
  <g transform="translate(600, 420)">
    <!-- Shadow beneath book -->
    <ellipse cx="0" cy="240" rx="460" ry="40" fill="#000000" opacity="0.6"/>

    <!-- Left Page -->
    <rect x="-420" y="-220" width="410" height="440" rx="4" fill="#1b1d24" stroke="rgba(255,255,255,0.1)"/>
    <!-- Left page content (architectural photo simulation) -->
    <rect x="-380" y="-180" width="330" height="240" fill="#252833"/>
    <polygon points="-380,60 -300,-100 -200,60" fill="#15171e"/>
    <polygon points="-260,60 -180,-140 -80,60" fill="#303442"/>
    <text x="-380" y="120" fill="#ffffff" font-family="'Syne', sans-serif" font-size="24" font-weight="800">MONOLITH</text>
    <text x="-380" y="150" fill="#8890a6" font-family="'Space Grotesk', monospace" font-size="11">RESIDENCE X // CONCRETE STUDY</text>
    <text x="-380" y="170" fill="#5e6478" font-family="'Space Grotesk', monospace" font-size="10">PLATE 04 • PAGE 38</text>

    <!-- Right Page -->
    <rect x="10" y="-220" width="410" height="440" rx="4" fill="#20222b" stroke="rgba(255,255,255,0.1)"/>
    <!-- Right page typography & blueprint -->
    <text x="50" y="-140" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700">01 // TECTONIC SHIFT</text>
    <g opacity="0.4" stroke="#ffffff" stroke-width="0.8">
      <line x1="50" y1="-100" x2="380" y2="-100"/>
      <line x1="50" y1="-80" x2="380" y2="-80"/>
      <line x1="50" y1="-60" x2="380" y2="-60"/>
      <line x1="50" y1="-40" x2="300" y2="-40"/>
    </g>
    <!-- Blueprint wireframe -->
    <rect x="50" y="0" width="330" height="180" fill="#141720" stroke="#00f0ff" stroke-width="1"/>
    <line x1="50" y1="0" x2="380" y2="180" stroke="#00f0ff" stroke-dasharray="4 4" opacity="0.5"/>
    <line x1="50" y1="180" x2="380" y2="0" stroke="#00f0ff" stroke-dasharray="4 4" opacity="0.5"/>
    <circle cx="215" cy="90" r="30" fill="none" stroke="#ccff00"/>

    <!-- Spine spine center crease -->
    <rect x="-15" y="-220" width="30" height="440" fill="#121318"/>
  </g>

  <!-- Editorial Meta Header -->
  <text x="70" y="80" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="14" letter-spacing="3">EDITORIAL PRINT // HARDCOVER BROCHURE</text>
  <text x="70" y="110" fill="#ffffff" font-family="'Syne', sans-serif" font-size="32" font-weight="800">KUROKAWA &amp; PARTNERS</text>
</svg>
