<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="aura-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0c1214"/>
      <stop offset="60%" stop-color="#050a0c"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    <linearGradient id="cyan-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>
    <filter id="animus-glow-a">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#aura-bg)"/>
  
  <!-- Subtle Geometry -->
  <g opacity="0.15" stroke="#00f0ff" stroke-width="1">
    <polygon points="600,100 850,550 350,550" fill="none"/>
    <circle cx="600" cy="400" r="240" fill="none" stroke-dasharray="6 4"/>
  </g>

  <!-- Corner Brackets -->
  <path d="M40 80 L40 40 L80 40" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M1160 80 L1160 40 L1120 40" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M40 720 L40 760 L80 760" fill="none" stroke="#d4af37" stroke-width="2"/>
  <path d="M1160 720 L1160 760 L1120 760" fill="none" stroke="#d4af37" stroke-width="2"/>

  <!-- Energy Arc -->
  <g filter="url(#animus-glow-a)">
    <path d="M120,640 C420,180 800,680 1080,240" fill="none" stroke="url(#cyan-gold)" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Text -->
  <text x="80" y="110" fill="#00f0ff" font-family="'Cinzel', Georgia, serif" font-size="14" letter-spacing="4">◈ MOBILE SOCIAL PROMO REEL</text>
  <text x="80" y="180" fill="#f6f1e3" font-family="'Cinzel', Georgia, serif" font-size="52" font-weight="900" letter-spacing="1">AURA HORIZON</text>
  <text x="80" y="220" fill="#d4af37" font-family="monospace" font-size="14" letter-spacing="3">DAVINCI RESOLVE // SPEED RAMP COLORGRADE</text>

  <!-- Duration Badge -->
  <rect x="1020" y="70" width="100" height="34" rx="4" fill="rgba(6,7,10,0.8)" stroke="#00f0ff"/>
  <text x="1070" y="93" text-anchor="middle" fill="#00f0ff" font-family="monospace" font-size="13" font-weight="bold">00:35</text>

  <!-- Play Glyph -->
  <circle cx="600" cy="400" r="50" fill="rgba(0,240,255,0.2)" stroke="#00f0ff" stroke-width="2" filter="url(#animus-glow-a)"/>
  <polygon points="592,382 616,400 592,418" fill="#00f0ff"/>
</svg>
