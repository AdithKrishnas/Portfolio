<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="cyber-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#180b26"/>
      <stop offset="50%" stop-color="#0a0512"/>
      <stop offset="100%" stop-color="#040206"/>
    </radialGradient>
    <linearGradient id="cyber-beam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="cyber-glow">
      <feGaussianBlur stdDeviation="25" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#cyber-bg)"/>
  
  <!-- Cyberpunk grid wave -->
  <g opacity="0.25" stroke="#ff007f" stroke-width="1">
    <path d="M0,500 Q300,350 600,500 T1200,500" fill="none"/>
    <path d="M0,550 Q300,400 600,550 T1200,550" fill="none"/>
    <path d="M0,600 Q300,450 600,600 T1200,600" fill="none"/>
    <path d="M0,650 Q300,500 600,650 T1200,650" fill="none"/>
    <path d="M0,700 Q300,550 600,700 T1200,700" fill="none"/>
  </g>

  <!-- High-fashion dynamic digital fabric curves -->
  <g filter="url(#cyber-glow)">
    <path d="M150,680 C320,180 750,750 1050,220" fill="none" stroke="url(#cyber-beam)" stroke-width="16" stroke-linecap="round"/>
    <path d="M220,720 C380,240 700,790 1020,290" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <circle cx="620" cy="460" r="140" fill="#7928ca" opacity="0.35" filter="url(#cyber-glow)"/>
  </g>

  <!-- Typography elements in poster style -->
  <text x="80" y="120" fill="#ff007f" font-family="'Space Grotesk', monospace" font-size="16" letter-spacing="4">SS26 MOTION CAMPAIGN</text>
  <text x="80" y="190" fill="#ffffff" font-family="'Syne', sans-serif" font-size="64" font-weight="900" letter-spacing="-2">CYBERPULSE</text>
  <text x="80" y="230" fill="#00f0ff" font-family="'Space Grotesk', monospace" font-size="18" letter-spacing="2">HYPERION DIGITAL FASHION // REEL 01</text>

  <!-- Duration badge -->
  <rect x="1000" y="80" width="120" height="36" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)"/>
  <text x="1060" y="103" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="13" font-weight="bold">00:45</text>

  <!-- Play icon overlay -->
  <circle cx="600" cy="400" r="54" fill="rgba(204,255,0,0.9)" filter="url(#cyber-glow)"/>
  <polygon points="590,380 620,400 590,420" fill="#070709"/>
</svg>
