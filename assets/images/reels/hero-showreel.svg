<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-grad-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10"/>
      <stop offset="50%" stop-color="#12141f"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="hero-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccff00"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff4365"/>
    </linearGradient>
    <filter id="hero-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#hero-grad-bg)"/>
  
  <!-- Subtle Matrix Perspective Lines -->
  <g opacity="0.15" stroke="#ccff00" stroke-width="1">
    <line x1="640" y1="400" x2="0" y2="800"/>
    <line x1="640" y1="400" x2="320" y2="800"/>
    <line x1="640" y1="400" x2="640" y2="800"/>
    <line x1="640" y1="400" x2="960" y2="800"/>
    <line x1="640" y1="400" x2="1280" y2="800"/>
    <line x1="640" y1="400" x2="0" y2="0"/>
    <line x1="640" y1="400" x2="1280" y2="0"/>
  </g>

  <!-- Central Glowing 3D Torus Wave Composition -->
  <g transform="translate(640, 390)">
    <!-- Outer energy ring -->
    <ellipse cx="0" cy="0" rx="360" ry="180" fill="none" stroke="url(#hero-neon)" stroke-width="2" opacity="0.6" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="320" ry="150" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4" transform="rotate(-10)"/>
    
    <!-- Deep fluid gradient orb -->
    <circle cx="0" cy="0" r="160" fill="url(#hero-neon)" opacity="0.22" filter="url(#hero-glow)"/>
    
    <!-- Core dynamic polygon -->
    <polygon points="0,-140 120,-40 90,110 -90,110 -120,-40" fill="none" stroke="#ccff00" stroke-width="3" filter="url(#hero-glow)"/>
    <polygon points="0,-110 95,-30 70,85 -70,85 -95,-30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
    
    <!-- Holographic grid crosshairs -->
    <circle cx="0" cy="0" r="12" fill="#ccff00" filter="url(#hero-glow)"/>
    <circle cx="0" cy="0" r="5" fill="#000000"/>
    <line x1="-220" y1="0" x2="220" y2="0" stroke="rgba(255,255,255,0.2)" stroke-dasharray="6 4"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="rgba(255,255,255,0.2)" stroke-dasharray="6 4"/>
  </g>

  <!-- Cinematic Technical Hud Overlay -->
  <text x="50" y="80" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="14" letter-spacing="4">SHOWREEL // CINEMA &amp; 3D</text>
  <text x="50" y="105" fill="#8890a6" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="2">RES: 4K UHD • 60FPS • DCI-P3 COLOR</text>

  <text x="1230" y="80" text-anchor="end" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="13" letter-spacing="3">REC ● 00:01:24:18</text>
  <text x="1230" y="105" text-anchor="end" fill="#8890a6" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1">AUDIO: MASTER STEREO 24-BIT</text>

  <!-- Bottom Badges -->
  <rect x="50" y="710" width="180" height="40" rx="8" fill="#161822" stroke="rgba(255,255,255,0.15)"/>
  <text x="140" y="735" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="12" font-weight="bold" letter-spacing="1.5">PLAY REEL (4K)</text>

  <text x="1230" y="740" text-anchor="end" fill="#ccff00" font-family="'Syne', sans-serif" font-size="28" font-weight="900" letter-spacing="-1">2026 VISUAL COMPILATION</text>
</svg>
