<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="suite-all-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d77f"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9e7d23"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="5" y="5" width="90" height="90" rx="14" fill="#0d111d" stroke="url(#suite-all-gold)" stroke-width="2"/>
  
  <!-- Outer Brotherhood Astrolabe Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.6"/>
  
  <!-- Center Brotherhood Diamond Crest -->
  <path d="M50,22 L72,50 L50,78 L28,50 Z" fill="none" stroke="url(#suite-all-gold)" stroke-width="2.2"/>
  
  <!-- Four Tool Quadrant Dots -->
  <circle cx="50" cy="32" r="3.5" fill="#f5d77f"/> <!-- Ai Gold -->
  <circle cx="68" cy="50" r="3.5" fill="#00f0ff"/> <!-- Ps Cyan -->
  <circle cx="50" cy="68" r="3.5" fill="#d4af37"/> <!-- Cn Gold -->
  <circle cx="32" cy="50" r="3.5" fill="#ff3366"/> <!-- Px Crimson -->

  <!-- Center Core -->
  <polygon points="50,44 56,50 50,56 44,50" fill="url(#suite-all-gold)"/>
</svg>
