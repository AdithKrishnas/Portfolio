<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="px-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1124"/>
      <stop offset="100%" stop-color="#0c0714"/>
    </linearGradient>
    <linearGradient id="px-spectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="35%" stop-color="#ff9933"/>
      <stop offset="70%" stop-color="#33ccff"/>
      <stop offset="100%" stop-color="#9933ff"/>
    </linearGradient>
    <filter id="px-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#px-bg)" stroke="url(#px-spectrum)" stroke-width="4"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="#ff3366" stroke-width="1.5" opacity="0.4"/>
  <circle cx="100" cy="95" r="42" fill="none" stroke="url(#px-spectrum)" stroke-width="8" opacity="0.85" filter="url(#px-glow)"/>
  <text x="100" y="132" text-anchor="middle" fill="#ffffff" font-family="'Syne', sans-serif" font-weight="900" font-size="82" letter-spacing="-3">Px</text>
  <text x="100" y="165" text-anchor="middle" fill="#ff70a6" font-family="'Space Grotesk', monospace" font-weight="700" font-size="16" letter-spacing="4">PRO</text>
</svg>
