<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="claude-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#24140b"/>
      <stop offset="100%" stop-color="#0e0703"/>
    </radialGradient>
    <filter id="claude-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#claude-bg)" stroke="#cc785c" stroke-width="3"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="rgba(217,119,6,0.3)" stroke-width="1.5"/>
  <!-- Claude Sunburst Star -->
  <g transform="translate(100, 100)" fill="#d97706" filter="url(#claude-glow)">
    <!-- 8 multi-length rays radiating outward -->
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z"/>
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z" transform="rotate(45)"/>
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z" transform="rotate(90)"/>
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z" transform="rotate(135)"/>
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z" transform="rotate(180)"/>
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z" transform="rotate(225)"/>
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z" transform="rotate(270)"/>
    <path d="M-8,-48 L8,-48 L4,-8 L-4,-8 Z" transform="rotate(315)"/>
    <circle cx="0" cy="0" r="16" fill="#cc785c"/>
    <circle cx="0" cy="0" r="8" fill="#ffd599"/>
  </g>
</svg>
