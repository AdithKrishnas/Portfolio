<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="agy-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1a24"/>
      <stop offset="100%" stop-color="#040b10"/>
    </radialGradient>
    <linearGradient id="agy-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#00ffcc"/>
    </linearGradient>
    <filter id="agy-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#agy-bg)" stroke="#00f0ff" stroke-width="3"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="rgba(212,175,55,0.4)" stroke-width="1.5"/>
  <g transform="translate(100, 100)" filter="url(#agy-glow)">
    <!-- Outer elliptical orbit -->
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="url(#agy-ring)" stroke-width="4" transform="rotate(-30)"/>
    <!-- Intersecting elliptical orbit -->
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="none" stroke="#d4af37" stroke-width="3.5" transform="rotate(30)"/>
    <!-- Center quantum core -->
    <circle cx="0" cy="0" r="16" fill="#00f0ff" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <!-- Orbital electron beacons -->
    <circle cx="42" cy="-24" r="5" fill="#f5d77f"/>
    <circle cx="-42" cy="24" r="5" fill="#00f0ff"/>
  </g>
</svg>
