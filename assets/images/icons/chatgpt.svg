<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="gpt-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0b1e19"/>
      <stop offset="100%" stop-color="#040d0a"/>
    </radialGradient>
    <filter id="gpt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#gpt-bg)" stroke="#10a37f" stroke-width="3"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- ChatGPT Swirling Knot -->
  <g transform="translate(100, 100) scale(1.15)" stroke="#10a37f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#gpt-glow)">
    <path d="M 0,-40 C 22,-40 38,-28 40,-10 C 40,8 24,18 0,18" />
    <path d="M 0,-40 C 22,-40 38,-28 40,-10 C 40,8 24,18 0,18" transform="rotate(60)" />
    <path d="M 0,-40 C 22,-40 38,-28 40,-10 C 40,8 24,18 0,18" transform="rotate(120)" />
    <path d="M 0,-40 C 22,-40 38,-28 40,-10 C 40,8 24,18 0,18" transform="rotate(180)" />
    <path d="M 0,-40 C 22,-40 38,-28 40,-10 C 40,8 24,18 0,18" transform="rotate(240)" />
    <path d="M 0,-40 C 22,-40 38,-28 40,-10 C 40,8 24,18 0,18" transform="rotate(300)" />
    <circle cx="0" cy="0" r="10" fill="#10a37f"/>
  </g>
</svg>
