<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="wp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a1924"/>
      <stop offset="100%" stop-color="#040b10"/>
    </radialGradient>
    <filter id="wp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#wp-bg)" stroke="#21759b" stroke-width="3"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <!-- WordPress W Crest -->
  <g transform="translate(100, 100)" filter="url(#wp-glow)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#21759b" stroke-width="5"/>
    <path d="M-36,-20 L-14,35 L-4,0 L8,35 L30,-20 L22,-20 L5,22 L-5,-10 L-15,22 L-28,-20 Z" fill="#21759b"/>
  </g>
</svg>
