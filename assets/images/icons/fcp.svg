<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="fcp-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1124"/>
      <stop offset="100%" stop-color="#0b050d"/>
    </radialGradient>
    <linearGradient id="fcp-stripes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <filter id="fcp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#fcp-bg)" stroke="#ff007f" stroke-width="3"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <!-- Clapperboard top tilted -->
  <g transform="translate(100, 100)" filter="url(#fcp-glow)">
    <!-- Base Board -->
    <rect x="-55" y="-20" width="110" height="75" rx="10" fill="#1b1c24" stroke="#ff007f" stroke-width="3"/>
    <!-- Stripes on base -->
    <path d="M-40,55 L-20,-20 M-10,55 L10,-20 M20,55 L40,-20" stroke="url(#fcp-stripes)" stroke-width="6" stroke-linecap="round"/>
    <!-- Clapper arm -->
    <g transform="rotate(-18, -55, -20)">
      <rect x="-55" y="-45" width="110" height="24" rx="6" fill="#2d1230" stroke="#00f0ff" stroke-width="2.5"/>
      <line x1="-35" y1="-21" x2="-20" y2="-45" stroke="#ffffff" stroke-width="6"/>
      <line x1="-5" y1="-21" x2="10" y2="-45" stroke="#ffffff" stroke-width="6"/>
      <line x1="25" y1="-21" x2="40" y2="-45" stroke="#ffffff" stroke-width="6"/>
    </g>
  </g>
</svg>
