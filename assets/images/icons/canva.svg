<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="canva-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c4cc"/>
      <stop offset="50%" stop-color="#7d2ae8"/>
      <stop offset="100%" stop-color="#ff3366"/>
    </linearGradient>
    <filter id="c-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#0c0717" stroke="url(#canva-grad)" stroke-width="4"/>
  <rect x="8" y="8" width="184" height="184" rx="38" fill="none" stroke="#7d2ae8" stroke-width="1.5" opacity="0.6"/>
  <!-- Stylized Canva Script 'C' -->
  <path d="M125,75 C115,62 98,58 80,68 C60,80 52,105 58,128 C64,150 85,158 108,150 C122,145 130,135 136,122" fill="none" stroke="url(#canva-grad)" stroke-width="14" stroke-linecap="round" filter="url(#c-glow)"/>
</svg>
