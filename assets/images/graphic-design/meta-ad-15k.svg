<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="meta-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a12"/>
      <stop offset="50%" stop-color="#0f111c"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="meta-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0064e0"/>
      <stop offset="50%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#ccff00"/>
    </linearGradient>
    <linearGradient id="glow-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181c2d"/>
      <stop offset="100%" stop-color="#10121d"/>
    </linearGradient>
    <filter id="m-glow">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#meta-bg)"/>

  <!-- Subtle Perspective Ad Grid Background -->
  <g opacity="0.12" stroke="#00d2ff" stroke-width="0.8">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
  </g>

  <!-- Left: Meta Ads Manager Performance Dashboard Widget -->
  <rect x="60" y="70" width="700" height="660" rx="16" fill="url(#glow-card)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Header of Dashboard -->
  <g transform="translate(90, 110)">
    <!-- Meta Infinity Logo Silhouette -->
    <path d="M12,6 C7.5,6 4,9.5 4,14 C4,18.5 7.5,22 12,22 C16,22 19,19 22,15.5 C25,19 28,22 32,22 C36.5,22 40,18.5 40,14 C40,9.5 36.5,6 32,6 C28,6 25,9 22,12.5 C19,9 16,6 12,6 Z" fill="none" stroke="#0081fb" stroke-width="3"/>
    <text x="56" y="18" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="16" font-weight="700">META ADS MANAGER // CAMPAIGN TELEMETRY</text>
    <text x="56" y="38" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="12">ACCOUNT: ADITHKRISHNA S. CREATIVE GROWTH</text>
  </g>

  <!-- Metrics Highlight Row (₹15,000 Budget & 4.8x ROAS) -->
  <g transform="translate(90, 190)">
    <!-- Box 1: Spend -->
    <rect x="0" y="0" width="190" height="110" rx="10" fill="#141724" stroke="rgba(204,255,0,0.4)" stroke-width="1.5"/>
    <text x="20" y="32" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1">AD BUDGET SPENT</text>
    <text x="20" y="72" fill="#ccff00" font-family="'Syne', sans-serif" font-size="34" font-weight="900">₹15,000</text>
    <text x="20" y="96" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="11">● 100% BUDGET UTILIZED</text>

    <!-- Box 2: ROAS -->
    <rect x="210" y="0" width="190" height="110" rx="10" fill="#141724" stroke="rgba(0,210,255,0.4)" stroke-width="1.5"/>
    <text x="230" y="32" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1">ATTRIBUTED ROAS</text>
    <text x="230" y="72" fill="#00d2ff" font-family="'Syne', sans-serif" font-size="34" font-weight="900">4.82x</text>
    <text x="230" y="96" fill="#00d2ff" font-family="'Space Grotesk', monospace" font-size="11">▲ +210% VS INDUSTRY AVG</text>

    <!-- Box 3: Revenue Generated -->
    <rect x="420" y="0" width="200" height="110" rx="10" fill="#141724" stroke="rgba(255,255,255,0.15)"/>
    <text x="440" y="32" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="11" letter-spacing="1">GROSS REVENUE</text>
    <text x="440" y="72" fill="#ffffff" font-family="'Syne', sans-serif" font-size="34" font-weight="900">₹72,300</text>
    <text x="440" y="96" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="11">NET RETURN PROFITABLE</text>
  </g>

  <!-- Performance Curves (Chart Area) -->
  <g transform="translate(90, 340)">
    <rect x="0" y="0" width="620" height="230" rx="10" fill="#121520" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="30" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="13" font-weight="700">CONVERSION VELOCITY &amp; CTR SCALING</text>
    <text x="450" y="30" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="12" font-weight="bold">AVG CTR: 3.84%</text>

    <!-- Chart Grid Lines -->
    <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
      <line x1="20" y1="70" x2="600" y2="70"/>
      <line x1="20" y1="120" x2="600" y2="120"/>
      <line x1="20" y1="170" x2="600" y2="170"/>
    </g>

    <!-- ROAS Scale curve -->
    <path d="M20,180 C100,175 160,150 220,130 C280,110 340,140 400,90 C460,70 520,50 600,40" fill="none" stroke="#ccff00" stroke-width="3" filter="url(#m-glow)"/>
    <path d="M20,195 C100,190 160,170 220,155 C280,140 340,160 400,120 C460,95 520,80 600,70" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="6 4"/>

    <!-- Data points -->
    <circle cx="220" cy="130" r="5" fill="#ccff00"/>
    <circle cx="400" cy="90" r="5" fill="#ccff00"/>
    <circle cx="600" cy="40" r="7" fill="#ccff00"/>
    <text x="590" y="25" text-anchor="end" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="12" font-weight="bold">PEAK 5.2x ROAS</text>

    <text x="20" y="215" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="11">DAY 01 (TESTING) ➔ DAY 04 (WINNER CREATIVE IDENTIFIED) ➔ DAY 07 (SCALED)</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(90, 600)">
    <text x="0" y="20" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="12">CREATIVE FORMATS: 9:16 INSTAGRAM REELS • 1:1 CAROUSEL ADS • KINETIC HOOKS</text>
    <text x="0" y="42" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="13" font-weight="bold">CREATIVE DIRECTION &amp; PERFORMANCE STRATEGY BY ADITHKRISHNA S.</text>
  </g>

  <!-- Right: Realistic Mobile Ad Preview Mockup (9:16 Reel Ad) -->
  <g transform="translate(800, 70)">
    <!-- Smartphone Frame -->
    <rect x="0" y="0" width="340" height="660" rx="36" fill="#0c0e14" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Screen -->
    <rect x="12" y="12" width="316" height="636" rx="28" fill="#140a1c" overflow="hidden"/>

    <!-- Speaker notch -->
    <rect x="110" y="22" width="120" height="18" rx="9" fill="#000000"/>

    <!-- Ad Content Visual Inside Screen -->
    <g transform="translate(12, 12)">
      <!-- Gradient Ad Background -->
      <rect width="316" height="636" rx="28" fill="url(#meta-bg)"/>

      <!-- Glowing visual art in ad -->
      <circle cx="158" cy="280" r="90" fill="url(#meta-blue-grad)" opacity="0.3" filter="url(#m-glow)"/>
      <polygon points="158,210 220,310 96,310" fill="none" stroke="#ccff00" stroke-width="3"/>

      <!-- Sponsored Ad Top Bar -->
      <g transform="translate(20, 50)">
        <circle cx="16" cy="16" r="16" fill="#ccff00"/>
        <text x="16" y="21" text-anchor="middle" fill="#000" font-family="'Syne', sans-serif" font-weight="900" font-size="12">AS</text>
        <text x="42" y="14" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="12" font-weight="bold">AdithKrishna S.</text>
        <text x="42" y="28" fill="#8892b0" font-family="'Space Grotesk', monospace" font-size="10">Sponsored • Instagram Reel Ad</text>
      </g>

      <!-- Ad Hook Text -->
      <g transform="translate(20, 420)">
        <rect x="0" y="0" width="220" height="26" rx="4" fill="#ccff00"/>
        <text x="8" y="18" fill="#070709" font-family="'Space Grotesk', monospace" font-weight="900" font-size="12">₹15,000 BUDGET EXPERIMENT</text>

        <text x="0" y="55" fill="#ffffff" font-family="'Syne', sans-serif" font-size="22" font-weight="900" line-height="1.1">HIGH-VELOCITY CREATIVE ADS</text>
        <text x="0" y="80" fill="#00d2ff" font-family="'Space Grotesk', monospace" font-size="12">Stop the scroll in under 2.4 seconds.</text>

        <!-- CTA Button on Ad -->
        <rect x="0" y="110" width="276" height="42" rx="8" fill="#0081fb"/>
        <text x="138" y="136" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', monospace" font-weight="bold" font-size="13">ORDER NOW / LEARN MORE</text>
      </g>
    </g>
  </g>
</svg>
