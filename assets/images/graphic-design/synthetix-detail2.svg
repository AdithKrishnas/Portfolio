<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <rect width="1000" height="700" fill="#090a0d"/>
  <text x="60" y="80" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="14">DYNAMIC LOGO MUTATIONS</text>
  <g transform="translate(200, 350)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="120" text-anchor="middle" fill="#8890a6" font-family="'Space Grotesk', monospace">STATE A (IDLE)</text>
  </g>
  <g transform="translate(500, 350)">
    <polygon points="0,-80 70,0 0,80 -70,0" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <text x="0" y="120" text-anchor="middle" fill="#8890a6" font-family="'Space Grotesk', monospace">STATE B (ACTIVE)</text>
  </g>
  <g transform="translate(800, 350)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ccff00" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="0" y="120" text-anchor="middle" fill="#8890a6" font-family="'Space Grotesk', monospace">STATE C (OVERDRIVE)</text>
  </g>
</svg>
