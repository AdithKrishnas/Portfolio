<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="nb-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#240714"/>
      <stop offset="60%" stop-color="#0e0307"/>
      <stop offset="100%" stop-color="#040102"/>
    </radialGradient>
    <linearGradient id="nb-fire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="50%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#nb-bg)"/>

  <!-- Aggressive Streetwear Apparel Graphics -->
  <g transform="translate(600, 400)">
    <!-- Cyber beast skull / geometric mask motif -->
    <path d="M0,-220 L160,-120 L180,60 L120,200 L0,250 L-120,200 L-180,60 L-160,-120 Z" fill="#14060b" stroke="url(#nb-fire)" stroke-width="4"/>
    
    <!-- Eyes and fangs -->
    <polygon points="-70,-40 -20,-10 -60,10" fill="#ffff00"/>
    <polygon points="70,-40 20,-10 60,10" fill="#ffff00"/>
    <polygon points="-30,80 0,160 30,80" fill="#ff0055"/>
    <line x1="-120" y1="120" x2="120" y2="120" stroke="#ff5500" stroke-width="2"/>
    <line x1="-100" y1="150" x2="100" y2="150" stroke="#ff5500" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="80" y="120" fill="#ff0055" font-family="'Space Grotesk', monospace" font-size="16" letter-spacing="4">TOKYO CYBERPUNK CAPSULE</text>
  <text x="80" y="190" fill="#ffffff" font-family="'Syne', sans-serif" font-size="64" font-weight="900">NEON BEAST</text>
  <text x="80" y="230" fill="#ff5500" font-family="'Space Grotesk', monospace" font-size="16">STREETWEAR MERCHANDISE // 450GSM FLEECE</text>

  <!-- Footer Limited run stamp -->
  <rect x="980" y="80" width="140" height="40" rx="8" fill="#ff0055"/>
  <text x="1050" y="105" text-anchor="middle" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="13" font-weight="bold">LIMITED 5000</text>
</svg>
