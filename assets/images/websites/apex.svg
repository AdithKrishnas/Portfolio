<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="apex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b0d"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#apex-grad)"/>

  <!-- High-density Trading UI Mockup -->
  <rect x="60" y="60" width="1080" height="680" rx="10" fill="#0d0e12" stroke="rgba(255,255,255,0.1)"/>
  
  <!-- Terminal Header -->
  <rect x="60" y="60" width="1080" height="45" fill="#13151b"/>
  <text x="90" y="88" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="14" font-weight="700">APEX TERMINAL v4.2</text>
  <text x="320" y="88" fill="#8890a6" font-family="'Space Grotesk', monospace" font-size="12">BTC/USD $94,280.50 (+4.82%)</text>
  <text x="600" y="88" fill="#8890a6" font-family="'Space Grotesk', monospace" font-size="12">ETH/USD $3,840.10 (+2.15%)</text>
  <text x="1080" y="88" text-anchor="end" fill="#00f0ff" font-family="'Space Grotesk', monospace" font-size="12">LATENCY: 0.8MS ● CONNECTED</text>

  <!-- Left: Order Book -->
  <rect x="60" y="105" width="240" height="635" fill="#101217" stroke-right="rgba(255,255,255,0.06)"/>
  <text x="80" y="135" fill="#5e6478" font-family="'Space Grotesk', monospace" font-size="11">PRICE</text>
  <text x="180" y="135" fill="#5e6478" font-family="'Space Grotesk', monospace" font-size="11">SIZE</text>
  <!-- Asks (Red) -->
  <g font-family="'Space Grotesk', monospace" font-size="12" fill="#ff4365">
    <text x="80" y="165">94,295.00</text><text x="180" y="165">1.452</text>
    <text x="80" y="190">94,290.00</text><text x="180" y="190">3.881</text>
    <text x="80" y="215">94,285.50</text><text x="180" y="215">0.910</text>
  </g>
  <!-- Spread -->
  <rect x="70" y="235" width="220" height="28" fill="#181a22"/>
  <text x="80" y="254" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="12" font-weight="bold">SPREAD: 0.50</text>
  <!-- Bids (Green) -->
  <g font-family="'Space Grotesk', monospace" font-size="12" fill="#ccff00">
    <text x="80" y="290">94,280.00</text><text x="180" y="290">5.210</text>
    <text x="80" y="315">94,275.50</text><text x="180" y="315">2.440</text>
    <text x="80" y="340">94,270.00</text><text x="180" y="340">8.905</text>
  </g>

  <!-- Center: Main Candlestick Chart Area -->
  <rect x="300" y="105" width="580" height="420" fill="#0d0e12"/>
  <!-- Chart Grid -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="300" y1="200" x2="880" y2="200"/>
    <line x1="300" y1="300" x2="880" y2="300"/>
    <line x1="300" y1="400" x2="880" y2="400"/>
    <line x1="450" y1="105" x2="450" y2="525"/>
    <line x1="650" y1="105" x2="650" y2="525"/>
  </g>
  <!-- Stylized candlesticks & indicators -->
  <path d="M320,400 L360,380 L420,420 L480,310 L540,330 L600,240 L680,260 L760,180 L840,160" fill="none" stroke="#ccff00" stroke-width="2.5"/>
  <path d="M320,420 L360,400 L420,430 L480,350 L540,360 L600,280 L680,300 L760,220 L840,200" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Bottom: Execution Log -->
  <rect x="300" y="525" width="580" height="215" fill="#101217"/>
  <text x="320" y="555" fill="#8890a6" font-family="'Space Grotesk', monospace" font-size="12">ORDER EXECUTION STREAM (SUB-MILLISECOND)</text>
  <text x="320" y="585" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="11">11:04:12.482 BUY 2.450 BTC @ 94,275.50 [FILLED]</text>
  <text x="320" y="610" fill="#ffffff" font-family="'Space Grotesk', monospace" font-size="11">11:04:13.109 BUY 0.812 BTC @ 94,278.00 [FILLED]</text>

  <!-- Right: Algorithmic Strategy Controls -->
  <rect x="880" y="105" width="260" height="635" fill="#0f1116"/>
  <text x="905" y="140" fill="#ffffff" font-family="'Syne', sans-serif" font-size="16" font-weight="700">EXECUTION RIG</text>
  <rect x="905" y="165" width="210" height="42" rx="6" fill="#1a1d26" stroke="rgba(255,255,255,0.1)"/>
  <text x="925" y="191" fill="#ccff00" font-family="'Space Grotesk', monospace" font-size="12">TWAP / ICEBERG ACTIVE</text>

  <rect x="905" y="225" width="210" height="46" rx="8" fill="#ccff00"/>
  <text x="1010" y="253" text-anchor="middle" fill="#070709" font-family="'Space Grotesk', monospace" font-size="13" font-weight="bold">TRANSACT ALGO</text>
</svg>
